<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HT TRADES · Temporarily Offline</title>
  <meta name="theme-color" content="#0f1724">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f28c28'/%3E%3Crect x='8' y='11' width='4' height='9' fill='%23fff'/%3E%3Crect x='14' y='13' width='4' height='8' fill='%233b1d04'/%3E%3Crect x='20' y='8' width='4' height='9' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1724;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo svg {
      width: 40px;
      height: 40px;
    }
    .logo span {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo b {
      color: #f28c28;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(242, 140, 40, 0.12);
      color: #f28c28;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: #f28c28;
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    footer {
      margin-top: 48px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#f28c28"/>
        <rect x="8" y="11" width="4" height="9" fill="#fff"/>
        <rect x="14" y="13" width="4" height="8" fill="#3b1d04"/>
        <rect x="20" y="8" width="4" height="9" fill="#fff"/>
      </svg>
      <span>HT <b>TRADES</b></span>
    </div>

    <h1>Temporarily Offline</h1>
    <p>We’re performing scheduled maintenance and improving the workspace. The platform will be back shortly.</p>

    <div class="badge">
      <span class="dot"></span>
      Maintenance in progress
    </div>

    <footer>
      © 2026 HT TRADES · Trading involves risk
    </footer>
  </div>
</body>
</html>
